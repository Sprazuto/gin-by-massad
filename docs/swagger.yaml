      ta1a:
        type: string
      ta1b:
        type: string
      ta1c:
        type: string
      ta2a:
        type: string
      ta2b:
        type: string
      ta2c:
        type: string
      tb1:
        type: string
      tb2:
        type: string
      tb3:
        type: string
      tc1:
