definitions:
  forms.CreateArticleForm:
    properties:
      content:
        maxLength: 1000
        minLength: 3
        type: string
      title:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - content
    - title
    type: object
  forms.CreateLkeEvaluasiForm:
    properties:
      berkas:
        type: string
      catatan:
        type: string
      evaluasi:
        type: string
      jawaban:
        type: string
      kode_evaluasi:
        maxLength: 50
        type: string
      lke_rekap_id:
        type: integer
      pranala:
        type: string
    required:
    - kode_evaluasi
    - lke_rekap_id
    type: object
  forms.CreateLkeKomponenForm:
    properties:
      bobot:
        type: number
      eviden:
        maxLength: 255
        minLength: 3
        type: string
      kode_evaluasi:
        maxLength: 50
        minLength: 3
        type: string
      komponen:
        maxLength: 255
        minLength: 3
        type: string
      level:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - bobot
    - eviden
    - kode_evaluasi
    - komponen
    - level
    type: object
  forms.CreateLkeRekapForm:
    properties:
      id_evaluator:
        type: integer
      id_ketua:
        type: integer
      id_opd:
        type: integer
      id_pengendali:
        type: integer
      id_verifikator:
        type: integer
      kelengkapan:
        type: number
      kelengkapan_m:
        type: number
      nilai_capaian:
        type: number
      nilai_capaian_m:
        type: number
      predikat:
        maxLength: 50
        type: string
      predikat_akhir:
        maxLength: 50
        type: string
      predikat_akhir_m:
        maxLength: 50
        type: string
      predikat_m:
        maxLength: 50
        type: string
      status_evaluasi:
        maxLength: 50
        type: string
      tahun:
        type: integer
    required:
    - id_evaluator
    - id_ketua
    - id_opd
    - id_pengendali
    - id_verifikator
    - kelengkapan
    - kelengkapan_m
    - nilai_capaian
    - nilai_capaian_m
    - predikat
    - predikat_akhir
    - predikat_akhir_m
    - predikat_m
    - status_evaluasi
    - tahun
